name: Update Tech Stack

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Without this the job gets the repository's DEFAULT token scope, which is
# read-only for `contents` in this repo — `git push` then dies with
# `403 Permission to MythEclipse/MythEclipse.git denied to github-actions[bot]`.
# The job exists only to commit one data file back to itself.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch languages
        run: |
          mkdir -p data
          # `ascii_downcase`, NOT `tolower`. `tolower` does not exist in jq at all
          # — it is not a 1.6-vs-1.7 difference — so this step died with
          # `jq: error: tolower/0 is not defined` on every scheduled run.
          LANGUAGES=$(curl -sf "https://api.github.com/users/MythEclipse/repos?per_page=100&sort=updated" | \
            jq -r '[.[] | select(.language != null) | .language] | unique | map(ascii_downcase)')
          
          cat > data/tech-stack.json << EOF
          {
            "updated": "$(date -Iseconds)",
            "username": "MythEclipse",
            "languages": $LANGUAGES
          }
          EOF
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tech-stack.json
          # `--cached`, not a bare `git diff`. `git diff` compares the WORKING TREE
          # against the index, so after `git add` it always reports no difference
          # and `|| git commit` never ran — the data file was regenerated and then
          # silently discarded on every run. `--cached` compares the index against
          # HEAD, which is the question actually being asked.
          if git diff --cached --quiet; then
            echo "tech-stack data unchanged; nothing to commit"
          else
            git commit -m "chore: update tech-stack data"
            git push
          fi